name: GUI regression tests

on:
  push:
    branches: [GUI-improvement]
  pull_request:
    paths:
      - 'SignalIntegrity/App/**'
      - 'Test/TestSignalIntegrity/TestSignalIntegrityApp/**'
      - 'Test/TestSignalIntegrity/TestGui/**'
      - 'Test/TestSignalIntegrity/TestAll.py'
      - '.github/workflows/gui-theme.yml'
      - 'setup.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  themes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      SIGNALINTEGRITY_REQUIRE_GUI_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install application and test dependencies
        run: python -m pip install ".[test]"
      - name: Install Linux virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb tk
      - name: Test Linux GUI
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest Test.TestSignalIntegrity.TestGui
      - name: Test Windows GUI
        if: runner.os == 'Windows'
        run: python -m unittest Test.TestSignalIntegrity.TestGui
