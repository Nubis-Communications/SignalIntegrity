[package]
name = "signalintegrity-desktop"
version = "1.5.6"
description = "SignalIntegrity desktop GUI (Tauri shell around the SignalIntegrity Python server)"
authors = ["Nubis Communications, Inc."]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
strip = true
lto = true
